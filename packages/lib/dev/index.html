<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qumu widgets – dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 24px auto;
      max-width: 1100px;
      padding: 0 16px;
    }

    /* cyberpunk theme for the grid, the widget options are in index.ts */
    .cyberpunk {
      background:
        repeating-linear-gradient(0deg, rgb(255 255 255 / .03) 0 1px, transparent 1px 3px),
        linear-gradient(rgb(0 240 255 / .07) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(90deg, rgb(0 240 255 / .07) 1px, transparent 1px) 0 0 / 32px 32px,
        #090114;
      border: 1px solid #ff2a6d;
      box-shadow: 0 0 24px rgb(255 42 109 / .35);
      color: #d1f7ff;
      font-family: 'Share Tech Mono', ui-monospace, monospace;
      padding: 24px;
    }

    .cyberpunk h2 {
      color: #fcee0a;
      font-family: Orbitron, sans-serif;
      letter-spacing: .12em;
      margin: 0 0 20px;
      text-shadow: 2px 0 #ff2a6d, -2px 0 #00f0ff, 0 0 12px rgb(252 238 10 / .6);
      text-transform: uppercase;
    }

    .cyberpunk h2::before {
      color: #ff2a6d;
      content: '// ';
    }

    .cyberpunk .qc-list-item:focus-visible {
      outline: none;
    }

    /* YouTube theme for the vertical list, the widget options are in index.ts */
    .youtube {
      background: #fff;
      color: #0f0f0f;
      font-family: Roboto, Arial, sans-serif;
      margin-top: 32px;
      padding: 24px;
    }

    .youtube h2 {
      align-items: center;
      display: flex;
      font-size: 20px;
      font-weight: 500;
      gap: 8px;
      margin: 0 0 16px;
    }

    .youtube__logo {
      background: #f00;
      border-radius: 6px;
      display: inline-grid;
      height: 20px;
      place-items: center;
      width: 28px;
    }

    .youtube__logo::after {
      border-bottom: 5px solid transparent;
      border-left: 8px solid #fff;
      border-top: 5px solid transparent;
      content: '';
      margin-left: 2px;
    }
  </style>
</head>
<body>
  <!-- containers referenced by the `selector` of the configurations in index.ts -->
  <section class="cyberpunk">
    <h2>Night City // Broadcasts</h2>
    <div id="list-grid"></div>
    <div id="list-grid2"></div>
  </section>

  <section class="youtube">
    <h2><span class="youtube__logo" aria-hidden="true"></span>Results</h2>
    <div id="list-vertical"></div>
  </section>

  <h2>Presentation widget</h2>
  <div id="presentation" style="max-width: 640px"></div>

  <script type="module" src="./index.ts"></script>
</body>
</html>
